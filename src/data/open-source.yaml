# Open Source — rendered at /open-source.
#
# `my_projects`: add a line per repository you own that you want to show.
#   The page fetches EVERYTHING else (title, description, stars, topics,
#   language, dates) from your synced GitHub data at build time. To keep data
#   fresh run:  npm run sync:github
#
#   Fields:
#     repository : owner/name  → the only required field (e.g. champ96k/quanta_db)
#     title      : optional display name; defaults to the repo name from GitHub
#     role       : optional label, e.g. "Author"
#     homepage   : optional live link (pub.dev, live site, marketplace, etc.)
#     description: optional override; defaults to the repo's GitHub description
#     image      : optional path/URL for a logo; use /logo-placeholder.svg
#                  (dummy) until you add real logos.
#     tags       : optional override; defaults to the repo's GitHub topics.

intro: >-
  I build and contribute to open-source software, mostly around Flutter, Dart,
  Android and developer tooling. Everything below is pulled live from my
  GitHub, repository data, stars, descriptions, chips and dates, and ordered
  by when each project was created.

