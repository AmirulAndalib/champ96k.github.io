# All projects Tushar personally built, newest first is automatic (sorted by `date`).
# Add a new project by appending an entry; the sites sorts everything itself.
#
# Fields (all optional except `id`, `title`, `date`):
#   id, title, description, date (YYYY-MM-DD), type, tags[], image, url,
#   github, status, technologies[], overview, what_i_built[], links[]
# The detail page only renders the sections that are present.
#
# `date` is the date the project was created (its repo's creation date), so the
# timeline reflects when the work started.

- id: project-1947
  title: Project 1947
  description: >-
    A digital library of Indian newspapers from 15 August 1947, the day India
    gained its independence, so you can read history exactly as it was
    reported.
  date: 2026-08-14
  type: Website
  tags: [TypeScript, Web, Archive]
  url: https://15aug1947.netlify.app/
  github: https://github.com/champ96k/15-agu-1947-archive
  status: Active
  overview: >-
    A digital library of Indian newspapers from 15 August 1947, the day India
    gained its independence. It lets history lovers read what people actually
    saw and read on that day, straight from the original pages.

